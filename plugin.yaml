id: guides
name: Guides
version: "2.0.0"
hubra: ">=0.2,<1"
description: "How-tos for machines, tools and everything else the club does, in Markdown or as a link to a manual or video, each on a page of its own with a table of contents. A guide can belong to an inventory item and name the qualification it takes."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-guides
tags: [guides, inventory]
package: hubra_guides
modules: [guides]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, events, nav, frontend, contracts]
