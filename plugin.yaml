id: guides
name: Guides
version: "1.5.0"
hubra: ">=0.2,<1"
description: "A usage guide per machine or tool, in Markdown or as a link to a manual or video, on a page of its own, linked from the inventory item. Qualifications (licences, first aid, machine inductions) with expiry and reminders, and who can do what."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-guides
tags: [inventory]
package: hubra_guides
modules: [inventory.guides]
requires: [inventory]
depends:
  inventory: ">=2.0,<3"
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, events, jobs, nav, frontend, contracts]
