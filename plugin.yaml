id: guides
name: Guides
version: "1.3.1"
hubra: ">=0.2,<1"
description: "A usage guide per machine or tool, in Markdown or as a link to a manual or video, on a page of its own, linked from the inventory item."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-guides
tags: [inventory]
package: hubra_guides
modules: [inventory.guides]
requires: [inventory]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, events, frontend, contracts]
