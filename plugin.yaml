id: guides
name: Qualifications
version: "2.0.0"
hubra: ">=0.2,<1"
description: "Qualifications with expiry and reminders: trainer licences (J+S), first aid, machine inductions. Members add what they can do, other members confirm it, and everyone sees who can do what. Inventory shows which qualification an item takes."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-guides
tags: [members, qualifications, skills]
package: hubra_guides
modules: [qualifications]
requires: [members]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, jobs, nav, frontend, contracts]
